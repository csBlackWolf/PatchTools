name: Feature idea / Funktionswunsch
description: Ideas for PatchTools, Maps and Bags. Deutsch und Englisch sind willkommen.
title: "[Idea]: "
labels: ["status: new", "enhancement"]
body:
  - type: dropdown
    id: addon
    attributes:
      label: Addon / Modul
      description: "Which addon is this about? / Um welches Addon geht es?"
      options:
        - PatchTools
        - PatchToolsMaps
        - PatchToolsBags
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Have an idea to make PatchTools more useful? Tell us about it below.
        No technical knowledge needed. English and German are both welcome.

        Eine Idee für PatchTools? Beschreibe sie einfach unten.
        Technisches Wissen ist nicht nötig. Deutsch und Englisch sind willkommen.
  - type: textarea
    id: idea
    attributes:
      label: Your idea / Deine Idee
      description: What would you like PatchTools to do? / Was soll PatchTools können?
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: How would it help? / Wobei würde es helfen?
      description: Optional. A short example is enough. / Optional. Ein kurzes Beispiel genügt.
    validations:
      required: false
  - type: input
    id: game
    attributes:
      label: WoW-Version
      description: Optional, for example Forever. / Optional, zum Beispiel Forever.
    validations:
      required: false
