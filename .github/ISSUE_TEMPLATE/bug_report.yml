name: Bug report
description: Report a problem with PatchTools, PatchToolsMaps or PatchToolsBags.
title: "[Bug]: "
labels: ["status: new", "bug"]
body:
  - type: dropdown
    id: addon
    attributes:
      label: Addon / Modul
      description: "Which addon is this about? / Um welches Addon geht es?"
      options:
        - PatchTools
        - PatchToolsMaps
        - PatchToolsBags
    validations:
      required: true
  - type: markdown
    attributes:
      value: "Run `/patchtools status` first. Redact private chat/account data. Never attach credentials or a full WTF folder."
  - type: input
    id: version
    attributes:
      label: Addon version / Addon-Version
      placeholder: "PatchTools 0.8.0; PatchToolsMaps 0.2.1 / PatchToolsBags 0.1.1"
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Diagnostic output
      description: "Paste all `/patchtools status` lines, or attach a screenshot. Include client version, build, interface and locales."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Game edition and operating system
      placeholder: "WoW Forever beta; Windows 11"
    validations:
      required: true
  - type: input
    id: feature
    attributes:
      label: Affected feature / Betroffene Funktion
      description: "Optional. Describe the feature in your own words; 'not sure' is fine. / Optional. Beschreibe die Funktion in eigenen Worten; 'weiß ich nicht' ist auch in Ordnung."
    validations:
      required: false
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: "Number the steps; mention enabled options and modifier keys."
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Full Lua error and stack trace
      description: "Include the complete text, or write 'No Lua error'. Screenshots are also accepted."
    validations:
      required: true
  - type: textarea
    id: addons
    attributes:
      label: Other addons and isolation test
      description: "List relevant bag/vendor/loot/minimap addons and versions. Does it happen with only the affected addon and its required PatchTools dependency enabled? Write 'not tested' if unknown."
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: "Loot: solo/group, full bags and confirmations. Repairs: damaged gear, repair vendor and sufficient money. Saved settings: /reload or full restart."
