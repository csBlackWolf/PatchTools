name: Bug report / Fehler melden
description: "Something isn't working? Tell us briefly. / Etwas funktioniert nicht? Beschreibe es kurz."
title: "[Bug]: "
labels: ["status: new", "bug"]
body:
  - type: dropdown
    id: addon
    attributes:
      label: Addon / Modul
      options:
        - PatchTools
        - PatchToolsMaps
        - PatchToolsBags
    validations:
      required: true
  - type: dropdown
    id: game
    attributes:
      label: WoW-Version
      options:
        - Forever
        - Classic Era
        - Other / Andere
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What went wrong? / Was klappt nicht?
      description: "What happened, and what should happen instead? A short description is enough. / Was passiert, und was sollte stattdessen passieren? Eine kurze Beschreibung genügt."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Addon-Version (optional)
  - type: textarea
    id: details
    attributes:
      label: More information or pictures / Weitere Infos oder Bilder (optional)
      description: "If helpful, add a screenshot, steps to trigger the problem, or a Lua error if one appears. / Wenn hilfreich: Screenshot, Schritte zum Auslösen oder eine Lua-Fehlermeldung, falls eine erscheint."
